<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The SSam: Performance Reports</title>
<style>
  :root { --navy:#001f52; --blue:#1B51A4; --ink:#0e1726; --muted:#5b6572;
           --line:#e6e9ef; --bg:#f5f7fb; --card:#fff; }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);line-height:1.5;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  header{background:linear-gradient(135deg,#001f52 0%,#1B51A4 100%);color:#fff;
          padding:38px 24px 52px;text-align:center}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;
          opacity:.75;font-weight:600;margin:0 0 14px}
  header h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em}
  header p{margin:10px auto 0;max-width:460px;opacity:.82;font-size:15px}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px 64px}
  .list{margin-top:-26px}
  a.card{display:flex;align-items:center;gap:18px;background:var(--card);
          border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0;
          text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(16,23,38,.04);
          transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,23,38,.10);border-color:#cdd6e6}
  a.card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  .badge{flex:0 0 auto;width:46px;height:46px;border-radius:11px;
          background:linear-gradient(135deg,#001f52,#1B51A4);color:#fff;display:flex;
          align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .body{flex:1 1 auto;min-width:0}
  .name{font-weight:700;font-size:16px;margin:0}
  .meta{color:var(--muted);font-size:13.5px;margin:3px 0 0}
  .arrow{flex:0 0 auto;color:var(--blue);font-size:20px;font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:36px;
          padding-top:22px;border-top:1px solid var(--line)}
  footer b{color:var(--navy)}
</style>
</head>
<body>
  <header>
    <p class="brand">chowly</p>
    <h1>The SSam</h1>
    <p>Google Search Ads performance reports, most recent first.</p>
  </header>
  <div class="wrap">
    <div class="list">
      <a class="card" href="./gsa-report-2026-10-15/">
        <div class="badge">GSA</div>
        <div class="body">
          <p class="name">Google Search Ads Performance Review</p>
          <p class="meta">Reporting period Aug 31 – Oct 14, 2026 &middot; run 2026-10-15</p>
        </div>
        <div class="arrow">&rarr;</div>
      </a>
    </div>
    <footer>Prepared by <b>Chowly</b> &middot; chowly.com</footer>
  </div>
</body>
</html>
